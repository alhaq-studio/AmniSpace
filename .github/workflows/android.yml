name: AmniQuest CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-and-test:
    name: Unit Tests & Lint Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure local.properties
        run: |
          cat <<EOF > local.properties
          SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          SUPABASE_API_KEY=${{ secrets.SUPABASE_API_KEY || 'placeholder-key' }}
          API_URL=${{ secrets.API_URL || 'https://placeholder.api.com' }}
          EOF

      - name: Grant execute permissions
        run: |
          chmod +x ./gradlew
          chmod +x ./ai/src/main/sentencepiece/build.sh

      - name: Run unit tests across all modules and flavors
        run: |
          ./gradlew \
            :core:testDebugUnitTest \
            :data:testDebugUnitTest \
            :backend:testDebugUnitTest \
            :ai:testDebugUnitTest \
            :app:testFdroidDebugUnitTest \
            :app:testPlayDebugUnitTest \
            --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

      - name: Run Lint Vital verification
        run: |
          ./gradlew \
            :app:lintVitalFdroidRelease \
            :app:lintVitalPlayRelease \
            --stacktrace

  build-release:
    name: Build F-Droid & Play Store Release APKs
    needs: verify-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build binutils

      - name: Configure local.properties
        run: |
          cat <<EOF > local.properties
          SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          SUPABASE_API_KEY=${{ secrets.SUPABASE_API_KEY || 'placeholder-key' }}
          API_URL=${{ secrets.API_URL || 'https://placeholder.api.com' }}
          EOF

      - name: Grant execute permissions
        run: |
          chmod +x ./gradlew
          chmod +x ./ai/src/main/sentencepiece/build.sh

      - name: Assemble F-Droid and Play Store Release APKs
        run: |
          ./gradlew assembleFdroidRelease assemblePlayRelease --stacktrace

      - name: Verify 16 KB page alignment on JNI native libraries
        run: |
          JNI_SO=$(find ai/build -name "libsentencepiece_jni.so" | grep "arm64-v8a" | head -n 1)
          if [ -n "$JNI_SO" ]; then
            echo "[INFO] Inspecting ELF LOAD segment alignment for $JNI_SO"
            readelf -l "$JNI_SO" | grep "LOAD"
          fi

      - name: Extract version name
        id: version
        run: |
          VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/')
          echo "[INFO] Detected version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare standardized APK artifacts
        run: |
          mkdir -p dist/fdroid dist/play
          VERSION="${{ steps.version.outputs.version }}"

          for flavor in fdroid play; do
            APK_DIR="app/build/outputs/apk/$flavor/release"
            for apk in "$APK_DIR"/*.apk; do
              filename=$(basename "$apk")
              if [[ "$filename" == *"universal"* ]]; then
                ABI="universal"
              elif [[ "$filename" == *"arm64-v8a"* ]]; then
                ABI="arm64-v8a"
              elif [[ "$filename" == *"armeabi-v7a"* ]]; then
                ABI="armeabi-v7a"
              elif [[ "$filename" == *"x86_64"* ]]; then
                ABI="x86_64"
              elif [[ "$filename" == *"x86"* ]]; then
                ABI="x86"
              else
                ABI="unknown"
              fi
              TARGET="dist/$flavor/AmniQuest-v${VERSION}-${flavor}-${ABI}.apk"
              cp "$apk" "$TARGET"
              echo "[INFO] Packaged $TARGET"
            done
          done

      - name: Upload F-Droid Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: AmniQuest-FDroid-APKs-v${{ steps.version.outputs.version }}
          path: dist/fdroid/AmniQuest-*.apk

      - name: Upload Play Store Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: AmniQuest-Play-APKs-v${{ steps.version.outputs.version }}
          path: dist/play/AmniQuest-*.apk
